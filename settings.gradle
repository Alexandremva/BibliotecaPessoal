// CONFIGURAÇÕES DO PROJETO: de onde o Gradle baixa plugins e bibliotecas, e quais módulos existem.

// Repositórios onde os PLUGINS do Gradle são procurados
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// Repositórios onde as BIBLIOTECAS (dependencies) são procuradas
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "BibliotecaPessoal" // Nome do projeto
include ':app'                          // Único módulo do projeto: o aplicativo
