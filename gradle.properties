# Propriedades globais do Gradle
# Memoria maxima (2 GB) para o processo de compilacao e textos em UTF-8 (acentos)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Usa as bibliotecas AndroidX (versao moderna das bibliotecas de suporte)
android.useAndroidX=true
# Cada modulo so enxerga os proprios recursos na classe R (compilacao mais rapida)
android.nonTransitiveRClass=true
